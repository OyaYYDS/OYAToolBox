<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具箱启动器</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div id="app" data-theme="dark">

  <!-- ═══ 标题栏 ═══════════════════════════════════════════════════════════ -->
  <div id="titlebar">
    <div id="titlebar-logo">
      <img class="logo-icon" src="../OYAToolBoxICO.ico" alt="应用图标">
      <span class="logo-text">OYA的工具箱</span>
    </div>
    <div id="titlebar-drag"></div>
    <div id="titlebar-controls">
      <button class="tb-btn" id="btn-pin" title="始终置顶">置顶</button>
      <button class="tb-btn" id="btn-settings" title="设置">⚙</button>
      <div style="width:1px;height:20px;background:var(--border-subtle);margin:0 4px"></div>
      <button class="tb-btn minimize" id="btn-minimize" title="最小化">─</button>
      <button class="tb-btn close"    id="btn-close"    title="关闭">✕</button>
    </div>
  </div>

  <!-- ═══ 工具栏 ═══════════════════════════════════════════════════════════ -->
  <div id="toolbar">
    <!-- 搜索框 -->
    <div id="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="搜索工具名称、描述、标签…" autocomplete="off">
      <button id="search-clear" title="清除">✕</button>
    </div>

    <div class="tb-separator"></div>

    <!-- 排序 -->
    <button class="tb-dropdown-btn" id="btn-sort" title="排序方式">
      <span>⇅</span>
      <span class="sort-label">排序</span>
    </button>

    <div class="tb-separator"></div>

    <!-- 视图切换 -->
    <button class="tb-icon-btn active" id="btn-view-grid" title="网格视图">⊞</button>
    <button class="tb-icon-btn"        id="btn-view-card" title="列表视图">☰</button>

    <div style="flex:1"></div>

    <!-- 添加按钮 -->
    <button id="btn-add">＋ 添加工具</button>
  </div>

  <!-- ═══ 分类标签栏 ════════════════════════════════════════════════════════ -->
  <div id="category-bar">
    <!-- 由 JS 动态生成 -->
  </div>

  <!-- ═══ 主体区域 ══════════════════════════════════════════════════════════ -->
  <div id="main-content">

    <!-- Grid 视图 -->
    <div id="grid-view"></div>

    <!-- Card 视图 -->
    <div id="card-view" style="display:none">
      <div id="card-list"></div>
      <div id="card-detail" class="empty">
        <div class="empty-hint">← 选择左侧工具查看详情<br>双击可直接启动</div>
      </div>
    </div>

  </div><!-- /main-content -->

</div><!-- /app -->

<!-- ═══ 悬停信息卡 ════════════════════════════════════════════════════════ -->
<div id="hover-card" class="hidden"></div>

<!-- ═══ 设置面板 ═════════════════════════════════════════════════════════ -->
<div id="settings-panel">
  <div class="panel-header">
    <span class="panel-title">⚙ 设置</span>
    <button class="panel-close" id="settings-close">✕</button>
  </div>
  <div class="panel-body">

    <!-- 外观 -->
    <div class="setting-group">
      <div class="setting-group-title">外观</div>

      <div class="form-group">
        <div class="form-label">主题</div>
        <div class="theme-row">
          <button class="theme-btn active" data-theme-target="dark">🌙 深色</button>
          <button class="theme-btn"        data-theme-target="light">☀ 浅色</button>
          <button class="theme-btn"        data-theme-target="system">💻 系统</button>
        </div>
      </div>

    </div>

    <!-- 行为 -->
    <div class="setting-group">
      <div class="setting-group-title">行为</div>

      <div class="setting-row">
        <div>
          <div class="setting-label">始终置顶</div>
          <div class="setting-hint">窗口显示在所有程序前面</div>
        </div>
        <div class="toggle" id="toggle-always-on-top"></div>
      </div>
    </div>

    <!-- 分类管理 -->
    <div class="setting-group">
      <div class="setting-group-title">分类管理</div>
      <div id="categories-list" class="categories-manage-list"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input type="text" class="form-input" id="new-category-input" placeholder="新分类名称…" style="flex:1">
        <button class="btn secondary" id="btn-add-category" style="flex-shrink:0">+ 添加</button>
      </div>
    </div>

  </div>
</div>

<!-- ═══ 添加/编辑工具对话框 ═══════════════════════════════════════════════ -->
<div id="add-dialog-overlay" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="add-dialog-title">添加工具</span>
      <button class="modal-close" id="add-dialog-close">✕</button>
    </div>
    <div class="modal-body">

      <!-- 图标预览 -->
      <div class="form-group">
        <div class="form-label">图标</div>
        <div class="icon-preview-wrap">
          <div class="icon-preview" id="icon-preview-img">
            <div class="text-icon" style="background:#4a9eff">?</div>
          </div>
          <div>
            <div class="icon-mode-btns">
              <button class="icon-mode-btn active" data-mode="auto">🤖 自动</button>
              <button class="icon-mode-btn"        data-mode="image">🖼 图片</button>
              <button class="icon-mode-btn"        data-mode="text">✏ 文字</button>
            </div>
            <div id="icon-image-group" style="display:none;margin-top:8px">
              <button class="btn secondary" id="btn-browse-icon" style="height:28px;font-size:12px">选择图片…</button>
            </div>
            <div id="icon-text-group" style="display:none;margin-top:8px;display:flex;gap:8px;align-items:center">
              <input type="text" class="form-input" id="icon-text-val" placeholder="文字(最多2个)" maxlength="2" style="width:70px">
              <input type="color" id="icon-color-val" value="#4a9eff" style="width:36px;height:28px;border:none;background:none;cursor:pointer;padding:2px">
            </div>
            <div id="icon-auto-group" style="margin-top:6px">
              <span style="font-size:11px;color:var(--text-tertiary)">自动从文件提取图标</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 名称 + 类型 -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="tool-name">名称 <span style="color:var(--text-danger)">*</span></label>
          <input type="text" class="form-input" id="tool-name" placeholder="工具名称" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label" for="tool-type">类型</label>
          <select class="form-select" id="tool-type">
            <option value="exe">可执行文件 (.exe)</option>
            <option value="bat">批处理脚本 (.bat)</option>
            <option value="cmd">命令脚本 (.cmd)</option>
            <option value="ps1">PowerShell (.ps1)</option>
            <option value="lnk">快捷方式 (.lnk)</option>
            <option value="folder">文件夹</option>
            <option value="url">网址 (URL)</option>
            <option value="file">其他文件</option>
          </select>
        </div>
      </div>

      <!-- 路径 -->
      <div class="form-group">
        <label class="form-label" for="tool-path">路径 / 网址 <span style="color:var(--text-danger)">*</span></label>
        <div style="display:flex;gap:8px">
          <input type="text" class="form-input" id="tool-path" placeholder="文件路径或 https://..." style="flex:1" autocomplete="off">
          <button class="btn secondary" id="btn-browse-path" style="flex-shrink:0">浏览…</button>
        </div>
      </div>

      <!-- 描述 -->
      <div class="form-group">
        <label class="form-label" for="tool-desc">描述</label>
        <textarea class="form-textarea" id="tool-desc" placeholder="简短描述（可选）" rows="2"></textarea>
      </div>

      <!-- 分类 -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="tool-category">分类</label>
          <select class="form-select" id="tool-category">
            <!-- 由 JS 动态填充（根据分类管理设置） -->
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">标签</label>
          <div class="tags-input-wrap">
            <input type="text" class="tag-input-field" id="tag-input-field" placeholder="输入标签后按回车…">
          </div>
        </div>
      </div>

      <!-- 高级 -->
      <details style="margin-top:4px">
        <summary style="cursor:pointer;font-size:12px;color:var(--text-secondary);user-select:none;padding:4px 0">▶ 高级选项</summary>
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:12px">
          <div class="form-group">
            <label class="form-label" for="tool-args">启动参数</label>
            <input type="text" class="form-input" id="tool-args" placeholder="--option value" autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label" for="tool-workdir">工作目录</label>
            <div style="display:flex;gap:8px">
              <input type="text" class="form-input" id="tool-workdir" placeholder="留空则使用文件所在目录" style="flex:1">
              <button class="btn secondary" id="btn-browse-workdir" style="flex-shrink:0">浏览…</button>
            </div>
          </div>
        </div>
      </details>

    </div>
    <div class="modal-footer">
      <button class="btn secondary" id="add-dialog-cancel">取消</button>
      <button class="btn primary"   id="add-dialog-save">保存</button>
    </div>
  </div>
</div>

<!-- ═══ 文件拖入遮罩 ════════════════════════════════════════════════════════ -->
<div id="drop-overlay">
  <div class="drop-hint">
    <span class="drop-icon">📂</span>
    <div class="drop-text">松开鼠标以添加工具</div>
    <div class="drop-sub">支持 .exe .bat .ps1 .lnk 及文件夹</div>
  </div>
</div>

<!-- ═══ Toast 容器 ══════════════════════════════════════════════════════════ -->
<div id="toast-container"></div>

<!-- ═══ 脚本 ════════════════════════════════════════════════════════════════ -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="js/bridge.js"></script>
<script src="js/hover_card.js"></script>
<script src="js/drag_handler.js"></script>
<script src="js/add_dialog.js"></script>
<script src="js/settings_panel.js"></script>
<script src="js/grid_view.js"></script>
<script src="js/card_view.js"></script>
<script src="js/app.js"></script>

<script>
// 填充分类下拉（从 DOM 中读取 category-bar 数据后由 app.js 动态更新）
// 此处在 app.js 加载后才会获取 categories，先用静态选项
// 当 settings 加载后，app.js 会更新分类下拉的 options
</script>

</body>
</html>
